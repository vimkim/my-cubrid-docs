<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
<title id="title">State across the successful probe and final transform</title><desc id="desc">A non-null verdict pointer selects the probe. It reports true for the forced value but leaves OOS selection false. The same attribute cache retains increments and LOB state for the final transform, which uses p0 as owner and enables normal selection.</desc>
<rect width="860" height="360" rx="16" fill="#f1f5fa"/>
<g font-family="system-ui,sans-serif" font-size="18" fill="#172b46">
<text x="25" y="35" font-weight="700" font-size="22">Same attribute cache, two distinct layouts</text>
<rect x="25" y="65" width="372" height="192" rx="10" fill="#fceac8" stroke="#a27120"/>
<text x="43" y="96" font-weight="700">PROBE</text><text x="43" y="133">Verdict pointer: non-null</text><text x="43" y="166">would_demote_oos = true</text><text x="43" y="199">selected = false; has_oos = false</text><text x="43" y="232">Full value bytes in image</text>
<rect x="463" y="65" width="372" height="192" rx="10" fill="#e2f3ec" stroke="#287e60"/>
<text x="481" y="96" font-weight="700">FINAL</text><text x="481" y="133">Owner pointer: p0 class OID</text><text x="481" y="166">Verdict pointer: null</text><text x="481" y="199">selected = true; has_oos = true</text><text x="481" y="232">Stub refers to p0-owned chain</text>
<path d="M405 160H453L443 153M453 160L443 167" stroke="#50627b" stroke-width="2" fill="none"/>
<rect x="25" y="280" width="810" height="55" rx="8" fill="white" stroke="#50627b"/>
<text x="43" y="314">Survives: updated DB_VALUEs + LOB state · Final re-seeds increment guard</text>
</g></svg>
