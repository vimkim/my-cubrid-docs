<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="title desc">
<title id="title">An inserted row selects one partition</title>
<desc id="desc">The new row id equals 10 selects p1, whose rule is id greater than or equal to 10. Partition p0, whose rule is id less than 10, is excluded as a destination. No stored data is deleted.</desc>
<rect width="600" height="210" rx="12" fill="#f3f5f8"/>
<g font-family="system-ui, sans-serif" font-size="18" fill="#1b2b42">
<rect x="20" y="80" width="180" height="52" rx="8" fill="white" stroke="#506178"/>
<text x="110" y="112" text-anchor="middle">New row: id = 10</text>
<path d="M200 96 L340 55" stroke="#7b8794" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M200 117 L340 157" stroke="#17604d" stroke-width="3"/>
<rect x="340" y="20" width="240" height="68" rx="8" fill="white" stroke="#7b8794"/>
<text x="460" y="47" text-anchor="middle">p0: id &lt; 10</text>
<text x="460" y="72" text-anchor="middle" font-size="15">Excluded destination</text>
<rect x="340" y="120" width="240" height="68" rx="8" fill="#e0f2e8" stroke="#17604d" stroke-width="2"/>
<text x="460" y="147" text-anchor="middle">p1: id ≥ 10</text>
<text x="460" y="172" text-anchor="middle" font-size="15">Selected destination</text>
</g></svg>
