<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
<title id="title">Three physical observations plus a logical value check</title><desc id="desc">The test expects the root to have no OOS file or records, p0 to have a file and one chunk record, and p1 to have neither. SELECT equality is checked separately. Presence flags require all three diagnostic rows.</desc>
<rect width="860" height="330" rx="16" fill="#f1f5fa"/>
<g font-family="system-ui,sans-serif" font-size="18" fill="#172b46">
<text x="25" y="35" font-size="22" font-weight="700">The regression checks ownership, not just readability</text>
<rect x="25" y="66" width="250" height="161" rx="10" fill="#e3dff3" stroke="#75629a"/><rect x="305" y="66" width="250" height="161" rx="10" fill="#e2f3ec" stroke="#287e60"/><rect x="585" y="66" width="250" height="161" rx="10" fill="#e4ecfa" stroke="#3f6cab"/>
<text x="44" y="100" font-weight="700">Root</text><text x="44" y="138">has_oos file: 0</text><text x="44" y="173">OOS records: 0</text><text x="44" y="206">saw_root: true</text>
<text x="324" y="100" font-weight="700">p0 · selected</text><text x="324" y="138">has_oos file: 1</text><text x="324" y="173">OOS records: 1</text><text x="324" y="206">saw_p0: true</text>
<text x="604" y="100" font-weight="700">p1</text><text x="604" y="138">has_oos file: 0</text><text x="604" y="173">OOS records: 0</text><text x="604" y="206">saw_p1: true</text>
<text x="25" y="267">SELECT equality = 1 · Cursor must reach DB_CURSOR_END</text><text x="25" y="302" font-size="16">Counts apply to this fresh table and small single-chunk forced value.</text>
</g></svg>
