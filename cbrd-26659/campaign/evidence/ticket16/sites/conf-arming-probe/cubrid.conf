# CBRD-26659 campaign ticket 16 -- cubrid.conf for the instrumentation install (debug_gcc).
# Written by t16_conf; the fault_injection_ids line (when armed) follows this template.
[service]
service=server

[common]
cubrid_port_id=26671
error_log_level=notification
data_buffer_size=64M
log_buffer_size=4M
fault_injection_action_prefer_abort_to_exit=no
# vacuum: small blocks so a short workload completes a block; log every vacuum error/warning
vacuum_log_block_pages=4
er_log_vacuum=-1
fault_injection_ids=700000
fault_injection_fire_at_occurrence=0
